services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: brandbaggy_backend
    env_file:
      - path: ./.env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: Backend.settings
      RUN_MIGRATIONS: "1"
      RUN_SEED: "1"
      RUN_COLLECTSTATIC: "1"
    expose:
      - "8000"
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/admin/login/', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(req, timeout=5)\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - shared_network

  celery_worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: brandbaggy_celery_worker
    env_file:
      - path: ./.env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: Backend.settings
      RUN_MIGRATIONS: "0"
      RUN_SEED: "0"
      RUN_COLLECTSTATIC: "0"
    command: ["celery", "-A", "Backend", "worker", "--loglevel=info"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - shared_network

  celery_beat:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: brandbaggy_celery_beat
    env_file:
      - path: ./.env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: Backend.settings
      RUN_MIGRATIONS: "0"
      RUN_SEED: "0"
      RUN_COLLECTSTATIC: "0"
    command: ["celery", "-A", "Backend", "beat", "--loglevel=info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - shared_network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://brand-baggy.duckdns.org}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://brand-baggy.duckdns.org}
        NEXT_PUBLIC_STRIPE_PUBLIC_KEY: ${NEXT_PUBLIC_STRIPE_PUBLIC_KEY:-}
    container_name: brandbaggy_frontend
    env_file:
      - path: ./.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    ports:
      - "3002:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - shared_network

networks:
  shared_network:
    external: true
